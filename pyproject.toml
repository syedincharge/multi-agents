[project]
name = "multi-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "deepagents>=0.7.38",
    "langchain>=1.5.0",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.8.0",
    "langfuse>=5.2.0",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-postgres>=3.2.1",
    "mcp>=1.28",
    "mermaid-magic>=0.1.4",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
]

[project.scripts]
multi-agent = "multi_agent:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
